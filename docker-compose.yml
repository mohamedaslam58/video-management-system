version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
      POSTGRES_DB: vms
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-vms_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change_me_minio_secret}
    ports:
      - "9000:9000"   # S3 API — needed for browser-facing presigned URLs
      - "9001:9001"   # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    environment:
      MTX_API: "yes"
      MTX_APIADDRESS: ":9997"
      MTX_WEBRTCADDITIONALHOSTS: "*"
    ports:
      - "8554:8554"   # RTSP
      - "8888:8888"   # HLS
      - "8889:8889"   # WebRTC (WHEP)
      - "9997:9997"   # control API (internal use by backend)

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: vms
      DB_PASSWORD: ${DB_PASSWORD:-change_me}
      DB_NAME: vms
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-vms_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change_me_minio_secret}
      S3_BUCKET: vms-recordings
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_HLS_BASE_URL: http://localhost:8888
      MEDIAMTX_WEBRTC_BASE_URL: http://localhost:8889
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy
      mediamtx:
        condition: service_started
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

  test-camera:
    image: bluenviron/mediamtx:latest
    restart: unless-stopped
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

  test-camera-feed:
    image: jrottenberg/ffmpeg:4.4-alpine
    restart: unless-stopped
    depends_on:
      - test-camera
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 3 && ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=25
      -f lavfi -i sine=frequency=1000
      -pix_fmt yuv420p -profile:v main
      -c:v libx264 -preset veryfast -c:a aac
      -f rtsp rtsp://test-camera:8554/test"

  test-camera-feed-1:
    image: jrottenberg/ffmpeg:4.4-alpine
    restart: unless-stopped
    depends_on:
      - test-camera
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 3 && ffmpeg -re -f lavfi -i testsrc=size=1280x720:rate=25
      -f lavfi -i sine=frequency=1000
      -pix_fmt yuv420p -profile:v main
      -c:v libx264 -preset veryfast -c:a aac
      -f rtsp rtsp://test-camera:8554/test1"

  test-camera-feed-2:
    image: jrottenberg/ffmpeg:4.4-alpine
    restart: unless-stopped
    depends_on:
      - test-camera
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 3 && ffmpeg -re -f lavfi -i testsrc2=size=1280x720:rate=25
      -f lavfi -i sine=frequency=440
      -pix_fmt yuv420p -profile:v main
      -c:v libx264 -preset veryfast -c:a aac
      -f rtsp rtsp://test-camera:8554/test2"

  test-camera-feed-3:
    image: jrottenberg/ffmpeg:4.4-alpine
    restart: unless-stopped
    depends_on:
      - test-camera
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 3 && ffmpeg -re -f lavfi -i smptebars=size=1280x720:rate=25
      -f lavfi -i sine=frequency=880
      -pix_fmt yuv420p -profile:v main
      -c:v libx264 -preset veryfast -c:a aac
      -f rtsp rtsp://test-camera:8554/test3"

  test-camera-feed-4:
    image: jrottenberg/ffmpeg:4.4-alpine
    restart: unless-stopped
    depends_on:
      - test-camera
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 3 && ffmpeg -re -f lavfi -i rgbtestsrc=size=1280x720:rate=25
      -f lavfi -i sine=frequency=1320
      -pix_fmt yuv420p -profile:v main
      -c:v libx264 -preset veryfast -c:a aac
      -f rtsp rtsp://test-camera:8554/test4"

volumes:
  pg_data:
  redis_data:
  minio_data:
